# One web service: Express serves the API and the built React site.
services:
  - type: web
    name: comfort-builders
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Optional, set these in the Render dashboard (not here):
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM, MAIL_TO
      # ADMIN_TOKEN, DATA_DIR
